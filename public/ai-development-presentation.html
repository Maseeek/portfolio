ht:6px}.old:before{background:var(--orange)}.new:before{background:var(--lime)}.blue:before{background:var(--blue)}.chart-controls{display:flex;gap:6px;flex-wrap:wrap}.chart-controls button{background:transparent;border:1px solid var(--rule);padding:7px 10px;color:var(--dim);font-size:11px;border-radius:4px}.chart-controls button.selected{color:var(--lime);border-color:var(--lime)}table{border-collapse:collapse;width:100%;font-size:14px}caption{text-align:left;color:var(--dim);font-size:12px;padding-bottom:14px}th{font-size:11px;color:var(--dim);font-weight:500;text-align:right}th:first-child,td:first-child{text-align:left}td{padding:12px 0;text-align:right;border-bottom:1px solid var(--rule)}th{padding-bottom:10px}.prompt{border-left:3px solid var(--lime);padding:0 0 0 24px;margin:24px 0}.prompt p{font-size:17px;line-height:1.5}.prompt b{color:var(--lime);font-weight:550;margin-right:8px}.steps{list-style:none;margin:20px 0 0;padding:0}.steps li{display:flex;align-items:baseline;gap:23px;padding:12px 0;border-bottom:1px solid var(--rule)}.steps li>span{color:var(--lime);font-size:13px}.steps b{font-size:20px;font-weight:500}.steps p{font-size:15px;color:var(--dim);margin:5px 0 0}.compact-steps{padding-left:25px;font-size:20px;line-height:1.4;margin:25px 0 0}.compact-steps li{padding:8px 0 8px 5px}.compact-steps li::marker{color:var(--lime)}blockquote{border-top:1px solid var(--rule);margin:28px 0 0;padding-top:22px;font-size:24px;line-height:1.3;color:var(--lime);max-width:900px}cite{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:12px}.review p{display:flex;gap:25px;padding:19px 0;margin:0;border-bottom:1px solid var(--rule)}.review span{font-size:12px;color:var(--lime);min-width:56px}.review b{font-size:21px;font-weight:500}.bio{font-size:18px;color:var(--lime);margin-top:24px}.bio span{font-size:13px;color:var(--dim)}.industry p{display:grid;grid-template-columns:95px 1fr;gap:25px;padding:20px 0;margin:0;border-bottom:1px solid var(--rule);font-size:19px}.industry b{color:var(--lime);font-weight:500}.industry span{color:var(--ink)}.footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);padding-top:14px;gap:10px}.footer button,.utility button{background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:4px;padding:6px 11px;font-size:12px}.footer button:disabled{opacity:.35;cursor:default}#count{font-size:12px;color:var(--dim)}.progress{height:2px;background:var(--rule);margin:18px 0 0}.progress div{height:2px;background:var(--lime);transition:width .2s}.utility{display:flex;gap:7px;margin:10px 0 0;align-items:center;flex-wrap:wrap}.utility label{font-size:11px;color:var(--dim);margin-left:auto}.utility input{accent-color:var(--lime)}#notes,#overview{display:none;background:#23282d;border-radius:10px;padding:24px;margin-top:12px}#notes.open,#overview.open{display:block}#notes h3{margin-top:0}#notes p{font-size:15px;white-space:pre-line;color:#e4e8eb;line-height:1.6}#notes li{font-size:12px;line-height:1.8}#notes a{overflow-wrap:anywhere}#overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#overview.open{display:grid}#overview button{text-align:left;padding:13px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--ink);font-size:13px}#overview button.current{border-color:var(--lime)}.help{font-size:10px;color:var(--dim);margin:10px 0 0}.cover{padding-top:32px}.closing h2{font-size:clamp(36px,5.6vw,56px);color:var(--lime)}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:4px}body:fullscreen{background:#181c20}body:fullscreen .deck{border-radius:0;max-width:1500px;margin:auto;padding:35px 70px}body:fullscreen .slide{min-height:650px}body:fullscreen h2{font-size:55px}body:fullscreen p{font-size:24px}body:fullscreen .chart{height:350px}body:fullscreen .fine{font-size:14px!important}body:fullscreen .prompt p,body:fullscreen .split p{font-size:22px}body:fullscreen .u const slides=[{"title": "Using AI in development", "body": "<p class=\"eyebrow\">Current tools and a practical workflow</p><h1>Using AI<br>in development</h1><p class=\"lead\">Agent mode, the tools around it,<br>and checking the result.</p><p class=\"date\">Maciek \u00b7 15 October 2026</p>", "notes": "This session shares a practical workflow for using agents in development, with examples from VS Code and personal projects. The tools and models are changing quickly, so the aim is to show what is useful now and what could be worth trying next.\n\nThe team already has Copilot. Some of the capabilities covered here are available in the existing setup, while others are examples from different harnesses. The distinction matters more than picking a single favourite tool.\n\nThere is room for different approaches across projects. The examples provide a starting point for discussion rather than a prescribed process for every team.", "sources": ["copilot"], "duration": "1 min", "optional": false, "theme": "cover"}, {"title": "The model and the harness", "body": "<h2>The model and the harness</h2><p class=\"lead\">The harness is the software that connects the model to the project.</p><div class=\"split\"><div><h3>What it can reach</h3><p>Files and search<br>Terminal and running processes<br>Browser and external tools</p><h3>How it keeps working</h3><p>Context, task state and recovery<br>Feedback after each action</p></div><div class=\"tool-list\"><p><b>Why that helps</b><br>It can inspect the actual code,<br>try a change, see a failure<br>and have another go.</p><p><b>The practical difference</b><br>Less copying information into chat.<br>Fewer steps that need me<br>to act as the go-between.</p></div></div><p class=\"take\">The same model can do more with the right tools and feedback.</p>", "notes": "A model can suggest a plausible change without seeing how the application really works. The harness gives it access to the repository and a way to act on what it finds. Search locates existing behavior, editing tools apply a change, and the terminal runs commands. Browser tools show behavior that source code alone cannot prove.\n\nThe useful part is the feedback loop. A failed command gives the agent something concrete to investigate. An unexpected page state shows that the implementation still needs work. Less information has to be copied manually between the application and chat.\n\nTool design matters as well. Precise editing tools help apply changes to the intended code. Context and task-state handling support longer work. Separate workers can investigate a focused question without putting every intermediate result in the main conversation.\n\nThe model, harness and available tools work together. A stronger model can still need help if it cannot observe the result. Useful tools expose the evidence needed for the task.\n\nDiscussion: Which step currently requires someone to copy an error, screenshot or result into chat?", "sources": ["copilot", "vs-quick", "vs-sub", "omp-edit"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "Features worth trying beyond chat", "body": "<h2>Features worth trying beyond chat</h2><p class=\"lead\">Much of this is available in Copilot. We mostly aren't using it yet.</p><div class=\"chart-controls\"><button class=\"selected\" data-harness=\"copilot\">What we can try</button><button data-harness=\"other\">Other harnesses</button></div><div id=\"copilotFeatures\" class=\"feature-view\"><table class=\"features\"><thead><tr><th>Feature</th><th>What it changes</th><th>A way to start</th></tr></thead><tbody><tr><td>Browser tools</td><td>The agent exercises the UI.</td><td>Ask it to run the app and try a flow.</td></tr><tr><td>Subagents</td><td>Separate research or review.</td><td>Ask for a focused subagent task.</td></tr><tr><td>Background work</td><td>A task continues separately.</td><td>Use a separate working copy.</td></tr><tr><td>Hooks</td><td>A script runs at a set event.</td><td>Start with a session log or context.</td></tr></tbody></table></div><div id=\"otherFeatures\" class=\"feature-view\" hidden><table class=\"features\"><thead><tr><th>Harness</th><th>Examples beyond our current access</th></tr></thead><tbody><tr><td>Codex</td><td>Parallel tasks in separate working copies, keeping edits apart.</td></tr><tr><td>OMP</td><td>Precise edits that detect when the file has changed since it was read.</td></tr><tr><td>Claude Code</td><td>Experimental teams with shared tasks and direct messaging.</td></tr></tbody></table><p class=\"fine\">These are concrete differences to explore, rather than a ranking. Native Claude Code, Codex and Cursor are outside our current work access.</p></div><p class=\"fine\"><b>VS Code:</b> open Agents, then Agent Customizations to configure MCP servers, hooks, skills and tool access. Setup varies by version and harness.</p>", "notes": "The team's starting point is mostly chat, with some agent-mode use. Several capabilities are already available in Copilot, depending on the editor version, selected harness and enabled tools.\n\nIn VS Code, open Agents and Agent Customizations. In Chat, the Configure Chat gear or the command Chat: Open Customizations opens the editor. This brings together MCP servers, skills, hooks and tool configuration. Tool availability and permission to run a tool are separate controls.\n\nBrowser tools let the agent exercise a running page. A practical request is: start the app, try this flow and report what happens. Playwright MCP is another documented option. It can be added from Extensions by searching @mcp playwright, then enabled in the agent's tools. The app still needs a working local setup and useful test data.\n\nA subagent is a separate worker with its own context. A focused research request could ask it to find the existing filtering behavior and return relevant files and constraints. That can keep the main conversation focused. A quick lookup may not need the extra coordination.\n\nA worktree is a separate working copy of the same Git repository. A background session can edit that copy while other work continues. Cloud sessions run in a different environment and may need separate setup. Background work depends on the host or service remaining available.\n\nHooks are scripts triggered by agent events, such as session start or tool completion. A simple starting point is a session log or automatic project context. Hook events and configuration differ between harnesses. VS Code calls these hooks; webhooks are a separate HTTP callback mechanism.\n\nCodex offers parallel sessions and background tasks using separate working copies. Copilot has related features too. OMP provides editing tools that identify the exact version of a file, helping detect edits based on stale code. Claude Code's experimental teams add shared tasks and direct messages between workers. These are examples of different tooling choices rather than a universal ranking.\n\nThe navigation shown here is for VS Code. Visual Studio has its own feature set and setup.", "sources": ["vs-quick", "mcp", "vs-sub", "vs-background", "vs-hooks", "gh-hooks", "codex-worktrees", "omp-edit", "cc-teams", "vs-customizations"], "duration": "3 min", "optional": false, "theme": ""}, {"title": "How the models have changed", "body": "<h2>How the models have changed</h2><div class=\"chart-controls\"><button data-benchmark=\"recent\" class=\"selected\">The last few months</button><button data-benchmark=\"history\">The view since 2024</button></div><div id=\"recentView\"><p class=\"lead benchmark-lead\">Recent coding models on harder evaluations</p><div id=\"recentChart\" class=\"chart\"></div><div class=\"legend\"><span class=\"dot old\">Opus 5 \u00b7 July</span><span class=\"dot new\">Opus 5.5 \u00b7 September</span><span class=\"dot blue\">GPT-6 Astra \u00b7 September</span></div><p class=\"fine\">Anthropic's release table. Settings differ. Terminal-Bench uses xhigh for Opus 5.5 and high for Astra. No Astra CursorBench result.</p></div><div id=\"historyView\" hidden><p class=\"lead benchmark-lead\">Reported SWE-bench Verified results</p><div id=\"historyChart\" class=\"chart\"></div><p class=\"fine\">Historical context, with the last point in April 2026. Different evaluation setups. The current view uses newer benchmarks.</p></div>", "notes": "The recent view compares reported results on three coding evaluations. Terminal-Bench measures tasks in a terminal. FrontierCode assesses whether coding changes meet its mergeability criteria. CursorBench uses ambiguous tasks involving multiple files. A score belongs to its own evaluation; the percentages are not interchangeable.\n\nThe chart uses Anthropic's September release table. Models ran at different reported effort settings, and small differences can fall within measurement noise. These results help identify models worth trying, rather than predict success on a particular team ticket. GPT-6.1 Sol appears in the following index comparison because this release table predates it.\n\nThe historical view shows reported SWE-bench Verified results since October 2024. This evaluation uses a curated set of real repository issues. The figures rise from 49.0% for the upgraded Sonnet 3.5 to 87.6% for Opus 4.7. The last point is April 2026. The recent view then uses newer evaluations.\n\nHarnesses, budgets and evaluation methods have changed across these releases. The history is useful context for revisiting past experiences, rather than a controlled measurement of the percentage of development work that can be automated.\n\nDiscussion: Which evaluation resembles the work on the next ticket? What would make a retry of an older failed task informative?", "sources": ["opus", "old", "haiku", "47"], "duration": "3 min", "optional": false, "theme": ""}, {"title": "Capability, cost and tokens", "body": "<h2>Capability, cost and tokens</h2><p class=\"lead\">The model and its effort setting both matter.</p><div class=\"chart-controls\" aria-label=\"Chart metric\"><button data-metric=\"intelligence\" class=\"selected\">Intelligence index</button><button data-metric=\"cost\">Cost / task</button><button data-metric=\"tokens\">Output tokens / task</button></div><div id=\"economicsChart\" class=\"chart\"></div><p id=\"metricMessage\" class=\"take\"></p><p class=\"fine\">Slopalytics snapshot \u00b7 13 Oct 2026 \u00b7 Artificial Analysis data. Benchmark task averages, not our engineering costs. Index points are not percentages. Output tokens exclude input context.</p>", "notes": "Use the buttons to inspect the same five configurations. These are measured entries in Slopalytics, not its estimated historical entries. Its embedded snapshot says fetched 13 October 2026 and identifies Artificial Analysis as the source. Preserve the effort labels. Cost per task means its benchmark aggregate, not a complete developer ticket or cost per successful production change.\n\nAt medium effort Opus 5.5 has a higher index score than Opus 5 and lower benchmark cost and output tokens. Small models open cheaper options for focused work. This is a particular comparison, not a law that every newer model consumes fewer tokens. At max effort Opus 5.5 has higher cost and token consumption than Opus 5 at max in this snapshot.\n\nThe index summarizes a benchmark suite. It does not measure intelligence per real engineering ticket. For our own work, track accepted outcomes, retries, time spent reviewing, elapsed time and total spend. Cost per accepted outcome is total cost divided by outcomes that meet the agreed bar. Include failed attempts.\n\nExtend: Toggle the token chart. A cheap token and a small number of tokens are separate things. Explain that reasoning can generate many output tokens even when the visible answer is short.", "sources": ["slop", "aa"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "Model choice is part of the workflow", "body": "<h2>Model choice is part of the workflow</h2><div class=\"split\"><div><h3>Focused, repeatable work</h3><p>Try Luna or Haiku for extraction,<br>summaries and narrow edits.</p><h3>Complex engineering</h3><p>Compare Sol and Opus on real tickets.<br>Increase effort when evidence warrants it.</p></div><div><table class=\"prices\"><caption>Standard API $ / 1M tokens</caption><thead><tr><th>Model</th><th>Input</th><th>Output</th></tr></thead><tbody><tr><td>GPT-6 Luna</td><td>0.10</td><td>0.50</td></tr><tr><td>Haiku 5.5*</td><td>0.10</td><td>0.50</td></tr><tr><td>GPT-6.1 Sol</td><td>2</td><td>10</td></tr><tr><td>Opus 5.5</td><td>4</td><td>20</td></tr></tbody></table><p class=\"fine\">*Haiku prompts up to 100K tokens. Standard, uncached rates. API prices differ from Copilot billing.</p></div></div><p class=\"take\">More reasoning can add latency and cost with little benefit.</p>", "notes": "Model choice includes both capability and reasoning effort. The official documentation positions GPT-6.1 Sol for complex work at a lower cost than Astra, and Luna for focused work at high volume. Haiku is another option for focused tasks. Actual performance on the project determines which option is useful.\n\nSol supports low through max reasoning effort, with medium as its default. Harnesses expose different controls, and Copilot availability depends on the models enabled by the organization.\n\nThe table compares standard uncached API prices. Those rates differ from Copilot billing and exclude caching, tool costs and other pricing tiers. Haiku's displayed rate applies to prompts up to 100K input tokens. A cheaper token does not necessarily mean a cheaper completed task.\n\nExtra reasoning can improve a difficult result, but can also add time and cost without much benefit on a simple change. Narrow scope and a checkable goal help avoid unnecessary work.\n\nIn the snapshot, moving Sol from high to max effort gains about 1.6 index points while benchmark cost rises from about $0.319 to $0.724 per task. That may be worthwhile for difficult work. It is a tradeoff to assess against the result.", "sources": ["sol", "luna", "haiku", "opus", "46", "slop"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "A ticket the agent can finish", "body": "<h2>A ticket the agent can finish</h2><p class=\"lead\">Example for a web application</p><div class=\"prompt\"><p><b>Goal</b> Add a status filter to the existing orders page.</p><p><b>Done when</b> Choosing a status shows matching orders. Clearing it restores all orders. Sorting and pagination still work. An empty result has a clear message.</p><p><b>Context and boundaries</b> Follow the existing query and component patterns. Keep authorization and the public API unchanged.</p><p><b>Validation</b> A developer tries the flow, or an agent exercises it with browser tools. Either can check the same acceptance criteria. Run relevant tests too.</p></div><p class=\"take\">A clear outcome leaves room for the agent to find the implementation.</p>", "notes": "This example ticket gives the agent an outcome, acceptance criteria and boundaries. The implementation remains open so it can inspect the repository and follow the existing design.\n\nFor ambiguous work, a short proposed approach can expose decisions that need input. A familiar narrow ticket may need less planning. Product meaning, integration boundaries and architectural constraints still come from the developer and the project.\n\nA comparable screen or test fixture provides useful context. The agent can find the relevant files and existing project commands rather than depend on guessed file names.\n\nHuman validation and agent browser validation are both useful approaches. A developer can exercise each acceptance criterion directly. A browser-capable agent can drive those same steps and provide evidence. Relevant automated tests can support either route.\n\nThe same behavior needs checking in both cases: matching results, clearing the filter, empty results, and interactions with sorting and pagination. Manual validation can suit a task that requires human judgment or setup. Browser tools can make repeated checks easier.\n\nDiscussion: What should happen after a reload, a page change or a change in access permissions?", "sources": ["goals", "copilot", "vs-quick", "mcp"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "My working loop", "body": "<h2>My working loop</h2><ol class=\"steps\"><li><span>01</span><div><b>Give it the ticket</b><p>One ticket or a related set, with a checkable finish.</p></div></li><li><span>02</span><div><b>Let it investigate and implement</b><p>Stronger models can often work out the how.</p></div></li><li><span>03</span><div><b>Let it run the checks</b><p>Failures feed the next change.</p></div></li><li><span>04</span><div><b>Review the change and evidence</b><p>Recheck after the final edit.</p></div></li></ol><p class=\"take\">Related tickets can share a plan, with a check after each milestone.</p>", "notes": "The loop begins with the intended outcome and a finish condition that can be checked. More capable models can often investigate the project and choose the implementation without instructions for every individual edit. Product and architectural decisions still benefit from developer input.\n\nThe same loop can cover a related set of tickets. An overall goal, dependencies and acceptance criteria for each milestone help the agent keep track. Independent work may be delegated. Changes that touch the same files or depend on each other often need an ordered approach. Integration checks matter as well as checks on each piece.\n\nRunning a build or test gives the agent external feedback. A browser or manual check adds evidence about the user flow. A successful command proves only what that command covers. A missing fixture or unavailable environment leaves a check incomplete.\n\nDiscussion: Which checks would demonstrate that a related set of tickets works together?", "sources": ["copilot", "goals", "verify", "cc-teams", "vs-sub"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "The codebase as context", "body": "<h2>The codebase as context</h2><p class=\"lead\">The agent uses the examples and decisions it can find.</p><div class=\"split\"><div><h3>Useful starting points</h3><p>Clear patterns for common work<br>Readable modules and interfaces<br>A reliable way to run the project<br>Tests for important behavior</p></div><div><h3>Context worth keeping</h3><p>What a feature is meant to do<br>Why a constraint exists<br>Where a decision was recorded<br>Which example is the current one</p></div></div><p class=\"take\">A clean codebase gives the agent better examples to follow.</p>", "notes": "The agent uses nearby code and repository instructions to understand a task. Several competing patterns can leave it guessing which one to follow. A clear current example and a short pointer often provide better context than a longer prompt.\n\nReadable modules, clear interfaces, useful tests and a reliable way to run the project help both developers and agents. Recorded decisions explain constraints that may not be obvious from code alone.\n\nComments are useful when they explain intent or a real limitation. Stale comments that excuse a workaround can send the next change in the wrong direction. The useful information describes the system as it works now.\n\nDiscussion: Which example would help a new colleague understand how to make this change? The agent needs a similar starting point.", "sources": ["matt", "pstack"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "Skills and working context", "body": "<h2>Skills and working context</h2><div class=\"split\"><div><h3>Skills capture a repeatable practice</h3><p><b>Matt Pocock</b><br>grill-me \u00b7 to-tickets \u00b7 tdd \u00b7 code-review</p><p><b>poteto / pstack</b><br>poteto-mode \u00b7 create-verification-skill<br>blast-radius</p></div><div><h3>Context is working memory</h3><p>A fresh chat for unrelated work.<br>A clear handoff between tasks.<br>Compaction for a long-running task.<br>Durable decisions in the repository.</p></div></div><blockquote>\u201cThese skills are designed to be small, easy to adapt, and composable.\u201d<cite>Matt Pocock \u00b7 Skills for Real Engineers</cite></blockquote>", "notes": "A skill packages a repeatable practice in instructions, sometimes with scripts or references. It might help clarify a request, split a plan into tickets, write a behavioral test or drive the application. The harness decides how to load it.\n\nMatt Pocock's collection and poteto's pstack show different ways to make engineering practices explicit. Their value comes from solving recurring problems. A small relevant skill can provide structure without requiring a large process for every edit.\n\nMore capable models can discover many implementation steps themselves. Team-specific requirements still need a clear source. Older prompting habits are worth revisiting when they no longer improve the result.\n\nA fresh chat helps separate unrelated work. For a long task, a handoff or repository note can retain decisions, constraints, checks and outstanding work. Compaction summarizes earlier context so a session can continue, but it may omit details. The actual files and current checks remain the evidence.\n\nDiscussion: Which recurring task would benefit from a small shared skill, and which instructions are already out of date?", "sources": ["matt", "pstack", "46"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "Reviewing agent work", "body": "<h2>Reviewing agent work</h2><div class=\"review\"><p><span>First</span><b>Does the change solve the ticket?</b></p><p><span>Then</span><b>Do the architecture and assumptions make sense?</b></p><p><span>Inspect</span><b>The diff, boundaries and failure cases.</b></p><p><span>Require</span><b>Evidence from the final revision.</b></p></div><p class=\"take\">A concise explanation and working result make review easier.</p><p class=\"fine\">Small changes and checkable behavior keep review manageable as generation gets faster.</p>", "notes": "Review begins with the outcome and design. Does the change solve the ticket? Is the behavior in the right layer? Does it reuse an existing interface or create a competing one? Have assumptions about data or access changed?\n\nThe diff still needs inspection, especially around data access, error handling and boundary cases. Tests are useful when they check expected behavior independently of the implementation. Repeating the same incorrect assumption in both code and tests can hide a defect.\n\nA concise explanation of decisions and remaining uncertainty helps focus review. Explanations and tool logs add context, but working behavior and checks establish whether the result meets the agreed bar.\n\nEvidence belongs to a particular version of the code. A final edit can require affected checks to run again. If a test changes, its expectation should still match the ticket.\n\nDiscussion: Which architectural assumption or failure case deserves the closest look in this change?", "sources": ["goals", "verify"], "duration": "2 min", "optional": false, "theme": ""}, {"title": "poteto and automated verification", "body": "<h2>poteto and automated verification</h2><p class=\"lead\">Lauren Tan's pstack makes the running product checkable.</p><p class=\"bio\">Netflix \u00b7 Meta / React Compiler \u00b7 Cursor<br><span>Current GitHub bio lists xAI and the React Compiler core team.</span></p><ol class=\"compact-steps\"><li>Define how to launch and drive the app.</li><li>Map a feature to an observable result.</li><li>Run verification and attach evidence to the PR.</li><li>Use a separate verifier for work that warrants it.</li></ol><blockquote>\u201cif you want to go fast, go deep first.\u201d<cite>poteto \u00b7 pstack README</cite></blockquote>", "notes": "Lauren Tan posts as poteto. Her pstack documentation describes work at Netflix, Meta and Cursor, alongside React Compiler involvement. Her GitHub bio currently lists xAI and the React Compiler core team.\n\nThe useful part of the workflow is making the running product checkable. An app-specific verification skill records how to launch the app, check the environment, drive behavior, capture evidence and clean up. A feature map connects parts of the application with the results that demonstrate they work.\n\nThis gives an agent a repeatable way to test a change and attach screenshots, traces or test output to a pull request. The developer no longer has to be the only person who can exercise every flow.\n\nVerification scales with the change. A worker can run a cheap deterministic check. More consequential work can use a separate verifier, including a different model family. A verdict refers to the revision that was checked; a later change can require verification again.\n\nDiscussion: What would a repeatable verification workflow need to launch and exercise one of our applications?", "sources": ["pstack", "poteto", "verify", "orchestrate"], "duration": "2 min", "optional": true, "theme": ""}, {"title": "Developer reactions to Opus 5.5", "body": "<h2>Developer reactions to Opus 5.5</h2><p class=\"lead\">What people report after using it for real work</p><blockquote>\u201copus 5.5 (medium) handled most of my work.\u201d<cite>Rajesh Thallam \u00b7 X \u00b7 September / October 2026</cite></blockquote><div class=\"split\"><div><h3>What he liked</h3><p>Less back-and-forth<br>Clearer responses<br>Medium effort was often enough</p></div><div><h3>Where he chose differently</h3><p>He still preferred Fable 5.1<br>for complex creative work.</p></div></div><p class=\"fine\">One developer's report, not a sentiment survey. The X post is available through a public mirror. Sources are in the notes.</p>", "notes": "Rajesh Thallam reports using Opus 5.5 through Claude, Claude Code and Firstmate. He describes fewer iterations, clearer communication and good results at medium effort, increasing effort when needed. He still prefers Fable 5.1 for complex creative work.\n\nThis adds a developer's experience alongside the benchmark charts. A model can be easier to work with without being the preferred option for every task. One report does not establish consensus or a measured reduction in errors.\n\nThe practical comparison is how much steering a task needs, how easy the change is to review and what it costs to finish. Those are things a team can observe on its own work.\n\nIndustry examples include customer reports from Clio about a task spanning six repositories, and Optiver about fewer turns and output tokens at comparable quality on its tasks. These are workload-specific reports published by Anthropic. Google's managed-agent documentation also shows dependency updates followed by a test command.\n\nLonger investigations, related tickets and routine maintenance become more useful when the agent has a repeatable way to check the result.\n\nDiscussion: Which part of the workflow would need less manual coordination if the agent could verify it directly?", "sources": ["rajesh-x", "rajesh-mirror", "opus", "google"], "duration": "2 min", "optional": true, "theme": ""}, {"title": "Trying it on a real task", "body": "<p class=\"eyebrow\">A practical next step</p><h2>Trying it on<br>a real task</h2><ol class=\"compact-steps\"><li>Pick a real task with a result that can be checked.</li><li>Try it in Copilot Agent using the available tools.</li><li>Validate it manually or with browser tools.</li><li>Compare notes on what worked and where it needed help.</li></ol><p class=\"take\">Different projects will suit different approaches.</p><p class=\"fine\">The models and tools keep changing. Revisit what works as they improve.</p>", "notes": "A useful next step is to try a real, bounded task and compare experiences. A familiar task makes it easier to judge the output and spot what the agent missed.\n\nValidation can happen manually or through browser tools. Useful things to compare include which model and tools were used, how much steering the task needed, and whether the final result met the expected standard.\n\nSome projects and tasks will be a better fit than others. That is useful to learn too. A personal-project demonstration can provide a concrete example for discussion.\n\nThe linked documentation provides setup steps for anyone who wants to explore further. Treat these examples as current options, and revisit them as the models and harnesses change.", "sources": ["copilot", "matrix", "sol", "luna", "opus"], "duration": "1 min", "optional": false, "theme": "closing"}], sources={"copilot": ["Copilot agent mode", "https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode?tool=visualstudio"], "matrix": ["Copilot feature matrix", "https://docs.github.com/en/copilot/reference/copilot-feature-matrix"], "goals": ["OpenAI \u00b7 Goals and verifiable outcomes", "https://developers.openai.com/cookbook/examples/codex/using_goals_in_codex"], "sol": ["OpenAI \u00b7 GPT-6.1 Sol", "https://developers.openai.com/api/docs/models/gpt-6.1-sol"], "luna": ["OpenAI \u00b7 GPT-6 Luna", "https://developers.openai.com/api/docs/models/gpt-6-luna"], "opus": ["Anthropic \u00b7 Opus 5.5, 22 September 2026", "https://www.anthropic.com/claude-opus-5-5"], "haiku": ["Anthropic \u00b7 Haiku 5.5", "https://www.anthropic.com/claude/haiku"], "old": ["Anthropic \u00b7 October 2024 Sonnet release", "https://www.anthropic.com/news/3-5-models-and-computer-use"], "46": ["Anthropic \u00b7 Opus 4.6", "https://www.anthropic.com/news/claude-opus-4-6"], "47": ["Anthropic \u00b7 Opus 4.7 system card", "https://www-cdn.anthropic.com/037f06850df7fbe871e206dad004c3db5fd50340/Claude%20Opus%204.7%20System%20Card.pdf"], "slop": ["Slopalytics \u00b7 snapshot fetched 13 October 2026", "https://slopalytics.com/"], "aa": ["Artificial Analysis \u00b7 intelligence methodology", "https://artificialanalysis.ai/methodology/intelligence-benchmarking"], "matt": ["Matt Pocock \u00b7 Skills for Real Engineers", "https://github.com/mattpocock/skills"], "pstack": ["poteto \u00b7 pstack", "https://github.com/cursor/plugins/blob/main/pstack/README.md"], "verify": ["pstack \u00b7 verification and PR workflow", "https://github.com/cursor/plugins/blob/main/pstack/docs/guide/06-verify-and-ship.md"], "orchestrate": ["pstack \u00b7 worker and verifier workflow", "https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/playbooks/orchestrate.md"], "poteto": ["Lauren Tan \u00b7 current GitHub profile", "https://github.com/poteto"], "omp": ["Oh My Pi \u00b7 project documentation", "https://github.com/can1357/oh-my-pi"], "google": ["Google \u00b7 Managed Agents update, August 2026", "https://blog.google/innovation-and-ai/technology/developers-tools/expanding-managed-agents-gemini-api-3-6-flash-hooks/"], "vs-tools": ["VS Code \u00b7 tools and browser workflows", "https://code.visualstudio.com/docs/agents/tools/tools"], "vs-quick": ["VS Code \u00b7 first task with browser validation", "https://code.visualstudio.com/docs/agents/quickstart"], "vs-sub": ["VS Code \u00b7 subagents", "https://code.visualstudio.com/docs/agents/run/subagents"], "vs-background": ["VS Code \u00b7 Agents window and worktrees", "https://code.visualstudio.com/docs/agents/run/agents-window"], "vs-hooks": ["VS Code \u00b7 hooks, preview and harness-specific setup", "https://code.visualstudio.com/docs/agent-customization/hooks"], "gh-hooks": ["GitHub \u00b7 Copilot CLI and cloud hook configuration", "https://docs.github.com/en/copilot/reference/hooks-reference"], "mcp": ["VS Code \u00b7 adding Playwright MCP tools", "https://code.visualstudio.com/learn/agents/2-extending-agents-with-mcp-servers"], "cc-teams": ["Claude Code \u00b7 experimental agent teams", "https://code.claude.com/docs/en/agent-teams"], "cc-hooks": ["Claude Code \u00b7 lifecycle hooks", "https://code.claude.com/docs/en/hooks"], "omp-edit": ["OMP \u00b7 hashline editing", "https://github.com/can1357/oh-my-pi/blob/main/docs/tools/edit.md"], "codex-worktrees": ["Codex \u00b7 parallel chats and worktrees", "https://learn.chatgpt.com/docs/environments/git-worktrees"], "rajesh-x": ["Rajesh Thallam \u00b7 original X post", "https://x.com/rajesh_thallam/status/2102618153415229807"], "rajesh-mirror": ["X post text \u00b7 retrieved through TwStalker mirror", "https://d46rckpsl2ks7laj5lfg.twstalker.com/rajesh_thallam/status/2102618153415229807"], "vs-customizations": ["VS Code \u00b7 Agent Customizations editor", "https://code.visualstudio.com/docs/agent-customization/overview"]}, econ=[{"id": "claude-opus-5-medium", "family": "claude-opus-5", "name": "Claude Opus 5", "variant": "Claude Opus 5 (medium)", "lab": "anthropic", "labName": "Anthropic", "released": "2026-07-24", "open": false, "deprecated": true, "effort": "medium", "effortLabel": "medium", "effortOrder": 30, "estimated": false, "intelligence": 44.8253265420613, "cost": 2.1894793086538695, "costTotal": 2731.91350481435, "tokens": 28977.35678529392, "tokensTotal": 49413512, "speed": 52.8612667168534, "time": 319.38236400943197, "inputPrice": 5, "outputPrice": 25, "context": 1000000, "short": "Opus 5 \u00b7 medium"}, {"id": "claude-opus-5-5-medium", "family": "claude-opus-5-5", "name": "Claude Opus 5.5", "variant": "Claude Opus 5.5 (medium with fallback)", "lab": "anthropic", "labName": "Anthropic", "released": "2026-09-22", "open": false, "deprecated": false, "effort": "medium", "effortLabel": "medium", "effortOrder": 30, "estimated": false, "intelligence": 51.2434931792768, "cost": 1.3360093438976588, "costTotal": 1626.8112374421187, "tokens": 25745.286895441168, "tokensTotal": 38156195, "speed": 78.8147269579086, "time": 202.92731614092875, "inputPrice": 4, "outputPrice": 20, "context": 1000000, "short": "Opus 5.5 \u00b7 medium"}, {"id": "gpt-6-1-sol-high", "family": "gpt-6-1-sol", "name": "GPT-6.1 Sol", "variant": "GPT-6.1 Sol (high)", "lab": "openai", "labName": "OpenAI", "released": "2026-09-29", "open": false, "deprecated": false, "effort": "high", "effortLabel": "high", "effortOrder": 40, "estimated": false, "intelligence": 50.2377777519769, "cost": 0.31914442375664703, "costTotal": 521.3175499431111, "tokens": 13191.870219821281, "tokensTotal": 25376903, "speed": 57.5583878630425, "time": 229.56287369866573, "inputPrice": 2, "outputPrice": 10, "context": 1000000, "short": "GPT-6.1 Sol \u00b7 high"}, {"id": "claude-haiku-5-5-high", "family": "claude-haiku-5-5", "name": "Claude Haiku 5.5", "variant": "Claude Haiku 5.5 (high)", "lab": "anthropic", "labName": "Anthropic", "released": "2026-10-07", "open": false, "deprecated": false, "effort": "high", "effortLabel": "high", "effortOrder": 40, "estimated": false, "intelligence": 37.8240211671094, "cost": 0.07942671568737021, "costTotal": 94.06688065451641, "tokens": 55387.818996128815, "tokensTotal": 97096318, "speed": 174.809948673297, "time": 191.254900959221, "inputPrice": 0.1, "outputPrice": 0.5, "context": 1000000, "short": "Haiku 5.5 \u00b7 high"}, {"id": "gpt-6-luna", "family": "gpt-6-luna", "name": "GPT-6 Luna", "variant": "GPT-6 Luna (max)", "lab": "openai", "labName": "OpenAI", "released": "2026-09-22", "open": false, "deprecated": false, "effort": "max", "effortLabel": "max", "effortOrder": 60, "estimated": false, "intelligence": 38.1245186869738, "cost": 0.06782295669812205, "costTotal": 122.05438368649308, "tokens": 50011.69043054027, "tokensTotal": 144380994, "speed": 134.247449696612, "time": 368.522222552635, "inputPrice": 0.1, "outputPrice": 0.5, "context": 1000000, "short": "GPT-6 Luna \u00b7 max"}];
let current=0,metric='intelligence',includeOptional=true;
const main=document.querySelector('#slides');
main.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme}" id="slide-${i}" aria-label="Slide ${i+1}: ${s.title}">${s.body}</section>`).join('');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function activeSlides(){return slides.map((s,i)=>i).filter(i=>includeOptional||!slides[i].optional)}
function show(i){let active=activeSlides();if(!active.includes(i))i=active[0];current=i;document.querySelectorAll('.slide').forEach((el,j)=>{el.classList.toggle('active',j===i);el.classList.toggle('excluded',!active.includes(j))});let pos=active.indexOf(i);document.querySelector('#count').textContent=`${pos+1} / ${active.length}`;document.querySelector('#section').textContent=slides[i].optional?'Optional industry example':'Agentic development';document.querySelector('#timing').textContent=slides[i].duration;document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===active.length-1;document.querySelector('#progress').style.width=`${(pos+1)/active.length*100}%`;document.querySelector('#noteText').textContent=slides[i].notes;document.querySelector('#sourceList').innerHTML=slides[i].sources.map(k=>`<li><a href="${sources[k][1]}" target="_blank" rel="noopener">${escapeHTML(sources[k][0])}</a></li>`).join('');document.querySelector('#noteHeading').textContent=`${slides[i].title} · ${slides[i].duration}`;renderOverview()}
function move(n){let a=activeSlides(),p=a.indexOf(current);show(a[Math.max(0,Math.min(a.length-1,p+n))])}
function renderOverview(){document.querySelector('#overview').innerHTML=activeSlides().map((i,p)=>`<button class="${i===current?'current':''}" data-slide="${i}">${String(p+1).padStart(2,'0')} &nbsp; ${escapeHTML(slides[i].title)}${slides[i].optional?' (optional)':''}</button>`).join('')}
function svg(w,h,inside,label){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${escapeHTML(label)}">${inside}</svg>`}
function text(x,y,t,size=13,color='#acb3b8',anchor='start'){return `<text x="${x}" y="${y}" font-family="Arial,sans-serif" font-size="${size}" fill="${color}" text-anchor="${anchor}">${escapeHTML(t)}</text>`}
function history(){const a=[['Oct 2024','Sonnet 3.5',49],['Oct 2025','Haiku 4.5',73.3],['Feb 2026','Opus 4.6',80.8],['Apr 2026','Opus 4.7',87.6]];let s='';[0,25,50,75,100].forEach(v=>{let y=205-v*1.6;s+=`<line x1="35" y1="${y}" x2="600" y2="${y}" stroke="#41484d"/>`+text(25,y+4,v,10,'#acb3b8','end')});a.forEach((d,i)=>{let x=70+i*140,h=d[2]*1.6;s+=`<rect x="${x}" y="${205-h}" width="80" height="${h}" fill="${i===3?'#d0f783':'#86a967'}"/>`+text(x+40,194-h,d[2]+'%',17,'#f1f0e9','middle')+text(x+40,227,d[0],12,'#f1f0e9','middle')+text(x+40,246,d[1],11,'#acb3b8','middle')});document.querySelector('#historyChart').innerHTML=svg(620,260,s,'SWE-bench Verified reported scores: Sonnet 3.5 49%, Haiku 4.5 73.3%, Opus 4.6 80.8%, Opus 4.7 87.6%.')}
function recent(){const a=[['Terminal-Bench 4.0',[52.3,66.4,57.9]],['FrontierCode v1.1',[48,54.4,53.3]],['CursorBench 4.0',[46.6,57.8,null]]];let s='';[0,20,40,60,80].forEach(v=>{let y=205-v*2;s+=`<line x1="28" y1="${y}" x2="620" y2="${y}" stroke="#41484d"/>`+text(20,y+4,v,10,'#acb3b8','end')});a.forEach((d,i)=>{let x=65+i*193;d[1].forEach((v,j)=>{let xx=x+j*40;if(v!==null)s+=`<rect x="${xx}" y="${205-v*2}" width="30" height="${v*2}" fill="${['#d99779','#d0f783','#87bce8'][j]}"/>`+text(xx+15,196-v*2,v.toFixed(1),11,'#f1f0e9','middle');else s+=text(xx+15,194,'n/a',10,'#acb3b8','middle')});s+=text(x+55,232,d[0],12,'#f1f0e9','middle')});document.querySelector('#recentChart').innerHTML=svg(640,250,s,'Reported coding benchmark scores, percent. '+a.map(d=>d[0]+': '+d[1].join(', ')).join('. '))}
function economics(){let max={intelligence:60,cost:2.5,tokens:60000}[metric],s='',left=197,right=560;const fmt=v=>metric==='cost'?'$'+v.toFixed(3):metric==='tokens'?(v/1000).toFixed(1)+'K':v.toFixed(1);for(let i=0;i<=4;i++){let val=max*i/4,x=left+(right-left)*i/4;s+=`<line x1="${x}" y1="15" x2="${x}" y2="222" stroke="#41484d"/>`+text(x,245,fmt(val),11,'#acb3b8','middle')}econ.forEach((m,i)=>{let y=25+i*40,v=m[metric],width=v/max*(right-left);s+=text(left-12,y+16,m.short,12,'#f1f0e9','end')+`<rect x="${left}" y="${y}" height="24" width="${width}" fill="${i===1?'#d0f783':i>1?'#87bce8':'#d99779'}"/>`+text(left+width+8,y+17,fmt(v),12,'#f1f0e9')});document.querySelector('#economicsChart').innerHTML=svg(635,260,s,metric+': '+econ.map(m=>m.short+' '+fmt(m[metric])).join('; '));document.querySelectorAll('[data-metric]').forEach(b=>b.classList.toggle('selected',b.dataset.metric===metric));document.querySelector('#metricMessage').textContent={intelligence:'Opus 5.5 improves on Opus 5 at medium effort.',cost:'Cheaper options can make more tasks economical.',tokens:'Token use depends on the model and reasoning effort.'}[metric]}
history();recent();economics();
document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);
document.querySelector('#toggleNotes').onclick=()=>{let e=document.querySelector('#notes');e.classList.toggle('open');document.querySelector('#toggleNotes').setAttribute('aria-expanded',e.classList.contains('open'))};
document.querySelector('#toggleOverview').onclick=()=>{let e=document.querySelector('#overview');e.classList.toggle('open');document.querySelector('#toggleOverview').setAttribute('aria-expanded',e.classList.contains('open'))};
document.querySelector('#overview').onclick=e=>{let b=e.target.closest('[data-slide]');if(b){show(+b.dataset.slide);document.querySelector('#overview').classList.remove('open')}};
document.querySelector('#optional').onchange=e=>{includeOptional=e.target.checked;show(current)};
document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;economics()});
document.querySelector('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}catch{document.querySelector('#help').textContent='Open the HTML file in a browser, then use its fullscreen command.'}};
document.querySelector('#print').onclick=()=>window.print();
document.querySelector('#downloadNotes').onclick=()=>{let content=slides.map((s,i)=>`# ${i+1}. ${s.title}${s.optional?' (optional)':''}\n\n${s.notes}\n\nSources\n${s.sources.map(k=>`- [${sources[k][0]}](${sources[k][1]})`).join('\n')}`).join('\n\n---\n\n');let url=URL.createObjectURL(new Blob([content],{type:'text/markdown'}));let a=document.createElement('a');a.href=url;a.download='speaker-notes.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Home')show(activeSlides()[0]);if(e.key==='End')show(activeSlides().at(-1));if(e.key.toLowerCase()==='n')document.querySelector('#toggleNotes').click();if(e.key.toLowerCase()==='o')document.querySelector('#toggleOverview').click()});
show(Math.max(0,Math.min(13,Number(new URLSearchParams(location.search).get('slide')||1)-1)));
console.log('Deck ready: '+slides.length+' slides, '+slides.filter(s=>s.optional).length+' independent optional slides.');

document.querySelectorAll('[data-harness]').forEach(b=>b.onclick=()=>{document.querySelector('#copilotFeatures').hidden=b.dataset.harness!=='copilot';document.querySelector('#otherFeatures').hidden=b.dataset.harness!=='other';document.querySelectorAll('[data-harness]').forEach(x=>x.classList.toggle('selected',x===b))});
document.querySelectorAll('[data-benchmark]').forEach(b=>b.onclick=()=>{document.querySelector('#recentView').hidden=b.dataset.benchmark!=='recent';document.querySelector('#historyView').hidden=b.dataset.benchmark!=='history';document.querySelectorAll('[data-benchmark]').forEach(x=>x.classList.toggle('selected',x===b))});
